# 构建 VitePress 站点并将其部署到 GitHub Pages 的示例工作流程
#
name: 🎈 Deploy VitePress site to Pages

on:
  # 在针对 `main` 分支的推送上运行。如果你
  # 使用 `master` 分支作为默认分支，请将其更改为 `master`
  push:
    branches: [main]

  # 每天北京时间 06:00（UTC 22:00）重新生成「每日推荐」并部署
  # GitHub Actions 的 cron 一律使用 UTC，22:00 UTC 即北京时间次日 06:00
  schedule:
    - cron: '0 22 * * *'

  # 允许你从 Actions 选项卡手动运行此工作流程
  workflow_dispatch:

# 设置 GITHUB_TOKEN 的权限：contents: write 用于把每日推荐提交回仓库
permissions:
  contents: write
  pages: write
  id-token: write

# 只允许同时进行一次部署，跳过正在运行和最新队列之间的运行队列
# 但是，不要取消正在进行的运行，因为我们希望允许这些生产部署完成
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 构建工作
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🎆 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 如果未启用 lastUpdated，则不需要
      - uses: pnpm/action-setup@v3 # 如果使用 pnpm，请取消注释
        with:
          version: 8
      # - uses: oven-sh/setup-bun@v1 # 如果使用 Bun，请取消注释
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: latest
          cache: pnpm # 或 npm / yarn
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Install dependencies
        run: pnpm install # 或 npm ci / yarn install / bun install

      # 先生成并在本地提交，VitePress 构建时才能从 git 历史读到当天的 lastUpdated
      - name: Generate and commit daily recommendation
        id: daily
        run: |
          pnpm daily
          git add docs/src/daily.md
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "今日推荐内容无变化，跳过提交"
          else
            DAY=$(grep -m1 '^# 每日推荐' docs/src/daily.md | sed 's/^# 每日推荐 · //')
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "chore(daily): 更新每日推荐 $DAY"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # GITHUB_TOKEN 发起的 push 不会再次触发本工作流，避免循环
      - name: Push daily recommendation
        if: steps.daily.outputs.changed == 'true'
        run: git push origin HEAD:${{ github.ref_name }}

      - name: Build with VitePress
        run: pnpm docs:build # npm run docs:build  / yarn docs:build / bun run docs:build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  # 部署工作
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: 🎉 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4